<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<title>Shieldfall</title>
<style>html,body{margin:0;min-height:100%;background:#0d1014;color:#eee;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{display:grid;place-items:center}.loading{text-align:center}.loading b{display:block;font-size:24px;letter-spacing:.08em;margin-bottom:8px}.loading span{color:#9aa6af;font-size:13px}</style>
</head>
<body>
<div class="loading"><b>SHIELDFALL</b><span>게임 불러오는 중…</span></div>
<script>
(async()=>{
  try{
    if(!('DecompressionStream' in window)) throw new Error('이 브라우저는 PWA 게임 압축 해제를 지원하지 않습니다. 최신 Chrome/Edge/Safari에서 열어주세요.');
    const b64=(await fetch('./app.gz.b64',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('게임 데이터를 불러오지 못했습니다.');return r.text()})).trim();
    const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(err){document.body.innerHTML='<div class="loading"><b>SHIELDFALL</b><span>'+String(err.message||err)+'</span></div>';console.error(err)}
})();
</script>
</body>
</html>
