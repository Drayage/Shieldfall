<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shieldfall">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Shieldfall</title>
<style>html,body{margin:0;min-height:100%;background:#0d1014;color:#eee;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}body{display:grid;place-items:center}.loading{text-align:center;padding:24px}.loading b{display:block;font-size:24px;letter-spacing:.08em;margin-bottom:8px}.loading span{color:#9aa6af;font-size:13px;line-height:1.6}</style>
</head>
<body>
<div class="loading"><b>SHIELDFALL</b><span>게임 불러오는 중…</span></div>
<script>
(async()=>{
  try{
    if(!('DecompressionStream' in window)) throw new Error('압축 게임 데이터를 지원하지 않는 브라우저입니다. 최신 Chrome/Edge/Safari에서 열어주세요.');
    const paths=[
      './app/chunk00.b64?v=c7c0b90c15b7','./app/chunk01a.b64?v=c7c0b90c15b7','./app/chunk01b.b64?v=c7c0b90c15b7',
      './app/chunk02.b64?v=c7c0b90c15b7','./app/chunk03.b64?v=c7c0b90c15b7','./app/chunk04.b64?v=c7c0b90c15b7',
      './app/chunk05.b64?v=c7c0b90c15b7','./app/chunk06.b64?v=c7c0b90c15b7','./app/chunk07.b64?v=c7c0b90c15b7'
    ];
    const parts=await Promise.all(paths.map(path=>fetch(path).then(r=>{if(!r.ok)throw new Error(`게임 데이터 로드 실패: ${path}`);return r.text()})));
    const b64=parts.join('').replace(/\s+/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading"><b>SHIELDFALL</b><span>'+String(err.message||err)+'</span></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
